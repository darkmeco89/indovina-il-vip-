        @keyframes ci {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pop {
            0%,
            100% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.03);
            }
        }
        @keyframes bi {
            from {
                opacity: 0;
                transform: scale(.7);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes imagePop {
            0% {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .ci {
            animation: ci .45s cubic-bezier(.22, 1, .36, 1) both;
        }
        .pop {
            animation: pop .55s ease;
        }
        .bi {
            animation: bi .35s ease both;
        }
        .fade-in {
            animation: fadeIn .4s ease both;

        // ============================================================
        // FUNZIONE PER PESCARE 10 VIP CASUALI SENZA RIPETIZIONI
        // ============================================================
        function getRandomVips(pool, count) {
            const shuffled = [...pool];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, count);
        }

        // ============================================================
        // PUNTEGGI
        // ============================================================
        const POINTS = [500, 400, 300, 200, 100];
        const norm = (s) => s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // ============================================================
        // REACT APP
        // ============================================================
        const { useState, useEffect, useRef } = React;

        function GameOver({ history, totalScore, onRestart, totalRounds }) {
            const max = totalRounds * 500;
            const pct = totalScore / max;
            const won = history.filter((h) => h.won).length;
            let rating, color, comment;
            if (pct >= 0.8) {
                rating = "🥇 ESPERTO VIP!";
                color = "#facc15";
                comment = "Fenomenale! Sei un'enciclopedia dei personaggi famosi!";
            } else if (pct >= 0.6) {
                rating = "🥈 QUASI ESPERTO";
                color = "#c0c0c0";
                comment = "Ottimo lavoro! Ne sai davvero tante!";
            } else if (pct >= 0.3) {
                rating = "🥉 NEL MEZZO";
                color = "#cd7f32";
                comment = "Risultato nella media. Allenati e torna più forte!";
            } else {
                rating = "📺 SEGUI PIÙ TV!";
                color = "#ef4444";
                comment = "Poco sui VIP? Segui più notizie e sfida di nuovo!";
            }

            return React.createElement("div", { className: "gameover-container" },
                React.createElement("div", { className: "gameover-box" },
                    React.createElement("div", { className: "trophy" }, "🏆"),
                    React.createElement("div", { className: "title" }, "Quiz Completato!"),
                    React.createElement("div", { className: "sub" }, won, " su ", totalRounds, " personaggi indovinati"),
                    React.createElement("div", { className: "score" }, totalScore),
                    React.createElement("div", { className: "max-score" }, "punti su ", max, " possibili"),
                    React.createElement("div", { className: "rating", style: { border: `1px solid ${color}50`, color } },
                        rating),
                    React.createElement("div", { className: "comment" }, comment),
                    React.createElement("div", { style: { maxHeight: "200px", overflowY: "auto", marginBottom: "16px" } },
                        history.map((h, i) =>
                            React.createElement("div", { key: i, className: `history-item ${h.won ? 'won' : 'lost'}` },
                                React.createElement("span", { className: "name" }, h.won ? "✅" : "❌", " ", React.createElement(
                                    "strong", null, h.vip)),
                                React.createElement("span", { className: `pts ${h.won ? 'won' : 'lost'}` }, h.won ?
                                    `+${h.pts}` : "0", " pt")
                            )
                        )
                    ),
                    React.createElement("button", { className: "btn-restart", onClick: onRestart }, "🔄 Gioca ancora")
                )
            );
        }

        function VIPQuiz() {
            // Genera 10 VIP casuali all'avvio
            const [roundVips, setRoundVips] = useState(() => getRandomVips(VIP_POOL, 10));
            const [roundIdx, setRoundIdx] = useState(0);
            const [clues, setClues] = useState(0);
            const [input, setInput] = useState("");
            const [wrong, setWrong] = useState([]);
            const [status, setStatus] = useState(null);
            const [score, setScore] = useState(0);
            const [lastPts, setLastPts] = useState(0);
            const [history, setHistory] = useState([]);
            const [over, setOver] = useState(false);
            const [showTextHint, setShowTextHint] = useState(false);
            const inputRef = useRef(null);

            const round = roundVips[roundIdx];
            const totalRounds = roundVips.length;
            const pts = clues === 0 ? 500 : POINTS[clues - 1];
            const nextPts = clues === 0 ? 400 : POINTS[Math.min(clues, 4)];
            const images = round ? IMAGES[round.imageKey] : null;
            const progress = ((roundIdx) / totalRounds) * 100;

            useEffect(() => {
                if (!status && !over && round) {
                    const t = setTimeout(() => inputRef.current?.focus(), 120);
                    return () => clearTimeout(t);
                }
            }, [roundIdx, status, over, round]);

            const doGuess = () => {
                const g = input.trim();
                if (!g || status || !round) return;
                const ok = round.aliases.some((a) => norm(a) === norm(g));
                if (ok) {
                    setScore((s) => s + pts);
                    setLastPts(pts);
                    setStatus("won");
                    setHistory((h) => [...h, { vip: round.vip, pts, won: true }]);
                } else {
                    setWrong((w) => [...w, g]);
                    if (clues < 5) {
                        setClues((c) => c + 1);
                    }
                    if (clues >= 5) {
                        setStatus("lost");
                        setHistory((h) => [...h, { vip: round.vip, pts: 0, won: false }]);
                    }
                }
                setInput("");
                setShowTextHint(false);
            };

            const doReveal = () => {
                if (clues < 5 && !status && round) {
                    setClues((c) => c + 1);
                }
            };

            const toggleTextHint = () => {
                if (!status) {
                    setShowTextHint(!showTextHint);
                }
            };

            const doGiveUp = () => {
                if (!status && round) {
                    setStatus("lost");
                    setHistory((h) => [...h, { vip: round.vip, pts: 0, won: false }]);
                }
            };

            const doNext = () => {
                if (roundIdx + 1 >= roundVips.length) {
                    setOver(true);
                } else {
                    setRoundIdx((i) => i + 1);
                    setClues(0);
                    setInput("");
                    setWrong([]);
                    setStatus(null);
                    setLastPts(0);
                    setShowTextHint(false);
                }
            };

            const doRestart = () => {
                const newVips = getRandomVips(VIP_POOL, 10);
                setRoundVips(newVips);
                setRoundIdx(0);
                setClues(0);
                setInput("");
                setWrong([]);
                setStatus(null);
                setLastPts(0);
                setScore(0);
                setHistory([]);
                setOver(false);
                setShowTextHint(false);
            };

            if (over || !round) {
                return React.createElement(GameOver, {
                    history,
                    totalScore: score,
                    onRestart: doRestart,
                    totalRounds: totalRounds
                });
            }

            const cBorder = status === "won" ? "won" : status === "lost" ? "lost" : "";

            return React.createElement("div", { className: "no-select", style: { minHeight: "100vh", background: "linear-gradient(158deg,#0d0921 0%,#1a0940 52%,#0c1e3c 100%)", color: "#fff", fontFamily: "'Segoe UI','Inter',system-ui,sans-serif", display: "flex", flexDirection: "column" } },
                // HEADER
                React.createElement("header", { className: "header" },
                    React.createElement("div", null,
                        React.createElement("div", { className: "header-title" }, "🎯 VIP QUIZ"),
                        React.createElement("div", { className: "header-sub" }, "INDOVINA IL PERSONAGGIO FAMOSO")
                    ),
                    React.createElement("div", { className: "header-right" },
                        React.createElement("div", { style: { display: "flex", gap: "5px" } },
                            roundVips.map((_, i) =>
                                React.createElement("div", {
                                    key: i,
                                    className: `dot ${i < roundIdx ? 'done' : i === roundIdx ? 'active' : 'empty'}`
                                })
                            )
                        ),
                        React.createElement("div", { className: "score-badge" }, "⭐ ", score)
                    )
                ),
                // BODY
                React.createElement("div", { className: "container" },
                    // Progress bar
                    React.createElement("div", null,
                        React.createElement("div", { className: "progress-bar" },
                            React.createElement("div", { className: "progress-fill", style: { width: `${progress}%` } })
                        ),
                        React.createElement("div", { className: "progress-text" }, roundIdx, " / ", totalRounds,
                            " completati")
                    ),
                    // Round info
                    React.createElement("div", { className: "round-info" },
                        React.createElement("div", { className: "round-label" }, "ROUND ", roundIdx + 1, " / ", totalRounds),
                        !status && React.createElement("div", { className: "pts-badge" },
                            React.createElement("span", null, "⭐"),
                            React.createElement("span", null, "Indovina ora per ", React.createElement("strong", null, pts, " pt"))
                        )
                    ),
                    // CLUE CARD
                    React.createElement("div", { className: `clue-card ${cBorder}` },
                        // Pips
                        clues > 0 && React.createElement("div", { className: "clue-header" },
                            React.createElement("span", null, "💡 Indizi rivelati"),
                            React.createElement("div", { className: "pips" },
                                [0, 1, 2, 3, 4].map((i) =>
                                    React.createElement("div", {
                                        key: i,
                                        className: `pip ${i < clues ? 'active' : 'empty'}`
                                    })
                                )
                            )
                        ),
                        // Clues
                        clues > 0 && React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "9px" } },
                            round.clues.slice(0, clues).map((clue, i) => {
                                const isNew = i === clues - 1;
                                return React.createElement("div", {
                                        key: `${roundIdx}-${i}`,
                                        className: `clue-item ${isNew && !status ? 'new' : ''} ${isNew && !status ? 'ci' : ''}`
                                    },
                                    React.createElement("span", { className: "num" }, "#", i + 1),
                                    React.createElement("span", { className: "text" }, clue)
                                );
                            })
                        ),
                        // Messaggio iniziale
                        clues === 0 && !status && React.createElement("div", { style: { textAlign: "center", padding: "20px 0", color: "rgba(255,255,255,.4)", fontSize: "14px" } },
                            "👀 Osserva l'immagine e indovina chi è!"
                        ),
                        // IMMAGINE TAGLIATA (durante il gioco)
                        !status && images && React.createElement("div", { className: "image-container" },
                            React.createElement("div", { className: "image-label" }, round.gender, " · ", round.nation),
                            React.createElement("img", {
                                src: images.cropped,
                                alt: `Indizio visivo per ${round.vip}`,
                                style: {
                                    width: "80%",
                                    maxHeight: "280px",
                                    objectFit: "contain",
                                    borderRadius: "16px",
                                    border: "2px solid rgba(250, 204, 21, .15)",
                                    boxShadow: "0 0 40px rgba(250, 204, 21, .08)",
                                    backgroundColor: "rgba(0, 0, 0, .2)",
                                    transition: "all .5s cubic-bezier(.34, 1.56, .64, 1)"
                                },
                                loading: "lazy",
                                onError: (e) => {
                                    e.target.src = images.full;
                                    console.log('Immagine cropped non trovata, uso full per:', round.vip);
                                }
                            })
                        ),
                        // IMMAGINE INTERA (quando vince)
                        status === "won" && images && React.createElement("div", { className: "image-container" },
                            React.createElement("div", { className: "image-label won-label" }, "✅ ", round.gender, " · ", round.nation),
                            React.createElement("img", {
                                src: images.full,
                                alt: `Immagine completa di ${round.vip}`,
                                className: "hint-image full",
                                loading: "lazy",
                                onError: (e) => {
                                    e.target.style.display = 'none';
                                }
                            })
                        ),
                        // TEXT HINT
                        !status && showTextHint && round.textHint && React.createElement("div", { className: "text-hint-container fade-in" },
                            React.createElement("span", null, round.textHint)
                        )
                    ),
                    // Wrong guesses
                    wrong.length > 0 && !status && React.createElement("div", { className: "wrong-container" },
                        React.createElement("div", { className: "label" }, "❌ Tentativi sbagliati:"),
                        React.createElement("div", null,
                            wrong.map((g, i) =>
                                React.createElement("span", { key: i, className: "wrong-tag bi" }, g)
                            )
                        )
                    ),
                    // WON
                    status === "won" && React.createElement("div", { className: "result-box won pop" },
                        React.createElement("div", { className: "emoji" }, "🎉"),
                        React.createElement("div", { className: "title" }, "Esatto! È ", React.createElement("span", { className: "highlight" }, round.vip), "!"),
                        React.createElement("div", { className: "sub" }, round.category),
                        React.createElement("div", { className: "pts" }, "+", lastPts, " pt"),
                        React.createElement("button", { className: "btn-next", onClick: doNext },
                            roundIdx + 1 < totalRounds ? `Round ${roundIdx + 2} →` : "🏆 Vedi risultati"
                        )
                    ),
                    // LOST
                    status === "lost" && React.createElement("div", { className: "result-box lost" },
                        React.createElement("div", { className: "emoji" }, "😔"),
                        React.createElement("div", { className: "sub", style: { fontSize: "13px", color: "rgba(255,255,255,.48)", marginBottom: "5px" } }, "Era..."),
                        React.createElement("div", { className: "lost-name" }, round.vip),
                        React.createElement("div", { className: "lost-sub" }, round.category),
                        React.createElement("button", { className: "btn-next", onClick: doNext },
                            roundIdx + 1 < totalRounds ? `Round ${roundIdx + 2} →` : "🏆 Vedi risultati"
                        )
                    ),
                    // INPUT
                    !status && React.createElement("div", { className: "input-group" },
                        React.createElement("div", { className: "input-row" },
                            React.createElement("input", {
                                ref: inputRef,
                                type: "text",
                                value: input,
                                onChange: (e) => setInput(e.target.value),
                                onKeyDown: (e) => e.key === "Enter" && doGuess(),
                                placeholder: "Scrivi il nome del VIP…",
                                maxLength: 60
                            }),
                            React.createElement("button", {
                                className: `btn-guess ${input.trim() ? 'active' : ''}`,
                                onClick: doGuess,
                                disabled: !input.trim()
                            }, "✓ Indovina")
                        ),
                        React.createElement("div", { className: "btn-row" },
                            React.createElement("button", { className: "btn-reveal", onClick: doReveal },
                                "💡 Prossimo indizio — poi max ", React.createElement("strong", null, nextPts, " pt")
                            ),
                            round.textHint && React.createElement("button", { className: "btn-text-hint", onClick: toggleTextHint },
                                showTextHint ? "🙈 Nascondi aiuto" : "🤔 Aiuto testuale"
                            )
                        ),
                        clues >= 5 && React.createElement("button", { className: "btn-giveup", onClick: doGiveUp },
                            "😞 Mi arrendo (0 pt)"
                        )
                    )
                ),
                // Dev tools warning
                React.createElement("div", { className: "dev-tools-warning" }, "🔒 F12 disabilitato")
            );
        }

        // ============================================================
        // RENDER
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(VIPQuiz));
    </script>
