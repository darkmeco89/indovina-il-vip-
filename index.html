function getImagePath(key, type){
    const base = BASE_PATH ? BASE_PATH : '';
    const path = base + '/images/' + key + (type === 'full' ? '_intera' : '') + '.jpg';
    console.log('🖼️ Percorso immagine:', path);
    return path;
}

const IMAGES = {};
const imageKeys = ['chiara','ronaldo','raffaella','elon','ludovica','dario','kurolily','luca','lewis','antonelli','pesh','belen'];
imageKeys.forEach(key => {
    IMAGES[key] = {
        cropped: getImagePath(key, 'cropped'),
        full: getImagePath(key, 'full')
    };
});
console.log('✅ IMMAGINI CARICATE:', Object.keys(IMAGES).length);

// ============================================================
// FUNZIONI UTILI
// ============================================================
function getRandomVips(pool, count){
    const s = [...pool];
    for(let i = s.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [s[i], s[j]] = [s[j], s[i]];
    }
    return s.slice(0, count);
}

const POINTS = [500, 400, 300, 200, 100];

function norm(s){
    return s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// ============================================================
// APP STATE
// ============================================================
let state = {
    roundVips: [],
    roundIdx: 0,
    clues: 0,
    wrong: [],
    status: null,
    score: 0,
    lastPts: 0,
    history: [],
    over: false,
    showTextHint: false
};

// ============================================================
// DOM REFS
// ============================================================
const $ = id => document.getElementById(id);
const dotsContainer = $('dotsContainer');
const scoreDisplay = $('scoreDisplay');
const roundLabel = $('roundLabel');
const ptsDisplay = $('ptsDisplay');
const nextPtsDisplay = $('nextPtsDisplay');
const progressFill = $('progressFill');
const progressText = $('progressText');
const clueCard = $('clueCard');
const clueHeader = $('clueHeader');
const pipsContainer = $('pipsContainer');
const cluesContainer = $('cluesContainer');
const initialMessage = $('initialMessage');
const imageContainer = $('imageContainer');
const textHintContainer = $('textHintContainer');
const wrongContainer = $('wrongContainer');
const wrongTags = $('wrongTags');
const resultBox = $('resultBox');
const inputGroup = $('inputGroup');
const vipInput = $('vipInput');
const guessBtn = $('guessBtn');
const revealBtn = $('revealBtn');
const textHintBtn = $('textHintBtn');
const giveUpBtn = $('giveUpBtn');

// ============================================================
// RENDER
// ============================================================
function render(){
    const round = state.roundVips[state.roundIdx];
    const totalRounds = state.roundVips.length;
    const pts = state.clues === 0 ? 500 : POINTS[state.clues - 1];
    const nextPts = state.clues === 0 ? 400 : POINTS[Math.min(state.clues, 4)];
    const progress = ((state.roundIdx) / totalRounds) * 100;

    dotsContainer.innerHTML = state.roundVips.map((_, i) =>
        `<div class="dot ${i < state.roundIdx ? 'done' : i === state.roundIdx ? 'active' : 'empty'}"></div>`
    ).join('');

    scoreDisplay.textContent = state.score;
    roundLabel.textContent = `ROUND ${state.roundIdx + 1} / ${totalRounds}`;

    if(!state.status){
        ptsDisplay.textContent = pts;
    }

    progressFill.style.width = progress + '%';
    progressText.textContent = state.roundIdx + ' / ' + totalRounds + ' completati';
    nextPtsDisplay.textContent = nextPts;

    clueCard.className = 'clue-card ' + (state.status === 'won' ? 'won' : state.status === 'lost' ? 'lost' : '');

    if(state.clues > 0){
        clueHeader.style.display = 'flex';
        pipsContainer.innerHTML = [0,1,2,3,4].map(i =>
            `<div class="pip ${i < state.clues ? 'active' : 'empty'}"></div>`
        ).join('');
    } else {
        clueHeader.style.display = 'none';
    }

    if(state.clues > 0 && round){
        cluesContainer.innerHTML = round.clues.slice(0, state.clues).map((clue, i) => {
            const isNew = i === state.clues - 1;
            return `<div class="clue-item ${isNew && !state.status ? 'new' : ''} ${isNew && !state.status ? ' ci' : ''}">
                        <span class="num">#${i + 1}</span>
                        <span class="text">${clue}</span>
                    </div>`;
        }).join('');
        cluesContainer.style.display = 'flex';
    } else {
        cluesContainer.style.display = 'none';
    }

    if(state.clues === 0 && !state.status){
        initialMessage.style.display = 'block';
    } else {
        initialMessage.style.display = 'none';
    }

    // IMMAGINE
    if(round && !state.status){
        const images = IMAGES[round.imageKey];
        if(images){
            console.log('🖼️ Caricamento immagine cropped per:', round.vip, images.cropped);
            imageContainer.innerHTML = `
                        <div class="image-label">${round.gender} · ${round.nation}</div>
                        <img src="${images.cropped}" alt="Indizio visivo per ${round.vip}" 
                             style="width:80%; max-height:280px; object-fit:contain; border-radius:16px; 
                                    border:2px solid rgba(250,204,21,.15); box-shadow:0 0 40px rgba(250,204,21,.08); 
                                    background-color:rgba(0,0,0,.2); transition:all .5s cubic-bezier(.34,1.56,.64,1)"
                             onerror="this.onerror=null; this.src='${images.full}'; console.log('❌ Cropped non trovato, uso full per: ${round.vip}');" />
                    `;
            imageContainer.style.display = 'flex';
        } else {
            console.warn('⚠️ Immagini non trovate per:', round.vip);
            imageContainer.style.display = 'none';
        }
    } else if(state.status === 'won' && round){
        const images = IMAGES[round.imageKey];
        if(images){
            imageContainer.innerHTML = `
                        <div class="image-label won-label">✅ ${round.gender} · ${round.nation}</div>
                        <img src="${images.full}" alt="Immagine completa di ${round.vip}" 
                             class="hint-image full" />
                    `;
            imageContainer.style.display = 'flex';
        } else {
            imageContainer.style.display = 'none';
        }
    } else {
        imageContainer.style.display = 'none';
    }

    if(state.showTextHint && !state.status && round){
        textHintContainer.style.display = 'block';
        textHintContainer.className = 'text-hint-container fade-in';
        textHintContainer.innerHTML = `<span>${round.textHint}</span>`;
    } else {
        textHintContainer.style.display = 'none';
    }

    if(state.wrong.length > 0 && !state.status){
        wrongContainer.style.display = 'block';
        wrongTags.innerHTML = state.wrong.map((g, i) =>
            `<span class="wrong-tag bi">${g}</span>`
        ).join('');
    } else {
        wrongContainer.style.display = 'none';
    }

    if(state.status === 'won' && round){
        resultBox.style.display = 'block';
        resultBox.className = 'result-box won pop';
        resultBox.innerHTML = `
                    <div class="emoji">🎉</div>
                    <div class="title">Esatto! È <span class="highlight">${round.vip}</span>!</div>
                    <div class="sub">${round.category}</div>
                    <div class="pts">+${state.lastPts} pt</div>
                    <button class="btn-next" onclick="doNext()">
                        ${state.roundIdx + 1 < state.roundVips.length ? `Round ${state.roundIdx + 2} →` : '🏆 Vedi risultati'}
                    </button>
                `;
    } else if(state.status === 'lost' && round){
        resultBox.style.display = 'block';
        resultBox.className = 'result-box lost';
        resultBox.innerHTML = `
                    <div class="emoji">😔</div>
                    <div style="font-size:13px; color:rgba(255,255,255,.48); margin-bottom:5px;">Era...</div>
                    <div class="lost-name">${round.vip}</div>
                    <div class="lost-sub">${round.category}</div>
                    <button class="btn-next" onclick="doNext()">
                        ${state.roundIdx + 1 < state.roundVips.length ? `Round ${state.roundIdx + 2} →` : '🏆 Vedi risultati'}
                    </button>
                `;
    } else {
        resultBox.style.display = 'none';
    }

    if(state.status){
        inputGroup.style.display = 'none';
    } else {
        inputGroup.style.display = 'flex';
        guessBtn.disabled = !vipInput.value.trim();
        guessBtn.className = 'btn-guess ' + (vipInput.value.trim() ? 'active' : '');
        giveUpBtn.style.display = state.clues >= 5 ? 'block' : 'none';
        revealBtn.style.display = state.clues < 5 ? 'flex' : 'none';
        textHintBtn.style.display = round && round.textHint ? 'flex' : 'none';
        textHintBtn.textContent = state.showTextHint ? '🙈 Nascondi aiuto' : '🤔 Aiuto testuale';
        textHintBtn.className = 'btn-text-hint ' + (state.showTextHint ? 'active' : '');
    }

    if(state.over){
        renderGameOver();
    }
}

function renderGameOver(){
    const totalRounds = state.roundVips.length;
    const max = totalRounds * 500;
    const pct = state.score / max;
    const won = state.history.filter(h => h.won).length;
    let rating, color, comment;
    if(pct >= 0.8){ rating = "🥇 ESPERTO VIP!"; color = "#facc15"; comment = "Fenomenale! Sei un'enciclopedia dei personaggi famosi!"; }
    else if(pct >= 0.6){ rating = "🥈 QUASI ESPERTO"; color = "#c0c0c0"; comment = "Ottimo lavoro! Ne sai davvero tante!"; }
    else if(pct >= 0.3){ rating = "🥉 NEL MEZZO"; color = "#cd7f32"; comment = "Risultato nella media. Allenati e torna più forte!"; }
    else { rating = "📺 SEGUI PIÙ TV!"; color = "#ef4444"; comment = "Poco sui VIP? Segui più notizie e sfida di nuovo!"; }

    document.getElementById('appContainer').innerHTML = `
                <div class="gameover-container" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
                    <div class="gameover-box">
                        <div class="trophy">🏆</div>
                        <div class="title">Quiz Completato!</div>
                        <div class="sub">${won} su ${totalRounds} personaggi indovinati</div>
                        <div class="score">${state.score}</div>
                        <div class="max-score">punti su ${max} possibili</div>
                        <div class="rating" style="border:1px solid ${color}50; color:${color}">${rating}</div>
                        <div class="comment">${comment}</div>
                        <div style="max-height:200px; overflow-y:auto; margin-bottom:16px;">
                            ${state.history.map((h, i) => `
                                <div class="history-item ${h.won ? 'won' : 'lost'}">
                                    <span class="name">${h.won ? '✅' : '❌'} <strong>${h.vip}</strong></span>
                                    <span class="pts ${h.won ? 'won' : 'lost'}">${h.won ? `+${h.pts}` : '0'} pt</span>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn-restart" onclick="doRestart()">🔄 Gioca ancora</button>
                    </div>
                </div>
            `;
}

// ============================================================
// ACTIONS
// ============================================================
function doGuess(){
    const g = vipInput.value.trim();
    const round = state.roundVips[state.roundIdx];
    if(!g || state.status || !round) return;
    const ok = round.aliases.some(a => norm(a) === norm(g));
    const pts = state.clues === 0 ? 500 : POINTS[state.clues - 1];

    if(ok){
        state.score += pts;
        state.lastPts = pts;
        state.status = 'won';
        state.history.push({ vip: round.vip, pts, won: true });
        vipInput.value = '';
        render();
        return;
    }

    state.wrong.push(g);
    if(state.clues < 5){
        state.clues += 1;
    }
    if(state.clues >= 5){
        state.status = 'lost';
        state.history.push({ vip: round.vip, pts: 0, won: false });
    }
    vipInput.value = '';
    state.showTextHint = false;
    render();
}

function doReveal(){
    const round = state.roundVips[state.roundIdx];
    if(state.clues < 5 && !state.status && round){
        state.clues += 1;
        render();
    }
}

function toggleTextHint(){
    if(!state.status){
        state.showTextHint = !state.showTextHint;
        render();
    }
}

function doGiveUp(){
    const round = state.roundVips[state.roundIdx];
    if(!state.status && round){
        state.status = 'lost';
        state.history.push({ vip: round.vip, pts: 0, won: false });
        render();
    }
}

function doNext(){
    if(state.roundIdx + 1 >= state.roundVips.length){
        state.over = true;
        render();
    } else {
        state.roundIdx += 1;
        state.clues = 0;
        state.wrong = [];
        state.status = null;
        state.lastPts = 0;
        state.showTextHint = false;
        vipInput.value = '';
        render();
    }
}

function doRestart(){
    state.roundVips = getRandomVips(VIP_POOL, 10);
    state.roundIdx = 0;
    state.clues = 0;
    state.wrong = [];
    state.status = null;
    state.score = 0;
    state.lastPts = 0;
    state.history = [];
    state.over = false;
    state.showTextHint = false;
    vipInput.value = '';
    document.getElementById('appContainer').innerHTML = `
                <div class="round-info">
                    <div class="round-label" id="roundLabel">ROUND 1 / 10</div>
                    <div class="pts-badge">
                        <span>⭐</span>
                        <span>Indovina ora per <strong id="ptsDisplay">500</strong> pt</span>
                    </div>
                </div>
                <div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">0 / 10 completati</div>
                </div>
                <div class="clue-card" id="clueCard">
                    <div class="clue-header" id="clueHeader" style="display:none;">
                        <span>💡 Indizi rivelati</span>
                        <div class="pips" id="pipsContainer"></div>
                    </div>
                    <div id="cluesContainer"></div>
                    <div id="initialMessage" class="no-clues-message">👀 Osserva l'immagine e indovina chi è!</div>
                    <div class="image-container" id="imageContainer" style="border-top:none; margin-top:8px; padding-top:8px;"></div>
                    <div id="textHintContainer" style="display:none;" class="text-hint-container fade-in"></div>
                </div>
                <div class="wrong-container" id="wrongContainer" style="display:none;">
                    <div class="label">❌ Tentativi sbagliati:</div>
                    <div id="wrongTags"></div>
                </div>
                <div id="resultBox" style="display:none;"></div>
                <div class="input-group" id="inputGroup">
                    <div class="input-row">
                        <input type="text" id="vipInput" placeholder="Scrivi il nome del VIP…" maxlength="60" />
                        <button class="btn-guess" id="guessBtn" disabled>✓ Indovina</button>
                    </div>
                    <div class="btn-row">
                        <button class="btn-reveal" id="revealBtn">💡 Prossimo indizio — poi max <strong id="nextPtsDisplay">400</strong> pt</button>
                        <button class="btn-text-hint" id="textHintBtn">🤔 Aiuto testuale</button>
                    </div>
                    <button class="btn-giveup" id="giveUpBtn" style="display:none;">😞 Mi arrendo (0 pt)</button>
                </div>
            `;

    const refs = ['dotsContainer','scoreDisplay','roundLabel','ptsDisplay','nextPtsDisplay',
        'progressFill','progressText','clueCard','clueHeader','pipsContainer','cluesContainer',
        'initialMessage','imageContainer','textHintContainer','wrongContainer','wrongTags',
        'resultBox','inputGroup','vipInput','guessBtn','revealBtn','textHintBtn','giveUpBtn'
    ];
    refs.forEach(id => { window[id] = $(id); });

    vipInput.addEventListener('input', function(){
        guessBtn.disabled = !this.value.trim();
        guessBtn.className = 'btn-guess ' + (this.value.trim() ? 'active' : '');
    });
    vipInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doGuess(); });
    guessBtn.addEventListener('click', doGuess);
    revealBtn.addEventListener('click', doReveal);
    textHintBtn.addEventListener('click', toggleTextHint);
    giveUpBtn.addEventListener('click', doGiveUp);

    render();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
vipInput.addEventListener('input', function(){
    guessBtn.disabled = !this.value.trim();
    guessBtn.className = 'btn-guess ' + (this.value.trim() ? 'active' : '');
});
vipInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doGuess(); });
guessBtn.addEventListener('click', doGuess);
revealBtn.addEventListener('click', doReveal);
textHintBtn.addEventListener('click', toggleTextHint);
giveUpBtn.addEventListener('click', doGiveUp);

// ============================================================
// INIT
// ============================================================
state.roundVips = getRandomVips(VIP_POOL, 10);
console.log('✅ VIP generati:', state.roundVips.map(v => v.vip).join(', '));
render();
console.log('🚀 VIP QUIZ caricato! Premi F12 per vedere la console.');
</script>
    
</body>
